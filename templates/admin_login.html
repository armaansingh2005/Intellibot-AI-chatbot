{% extends "base.html" %}
{% block title %}Administrator sign in | IntelliBot AI{% endblock %}
{% block content %}
<section class="login-wrap">
  <form class="surface login-card" method="post" action="{{ url_for('admin.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-brand"><span class="brand-mark">i</span></div>
    <span class="eyebrow">PRIVATE ADMIN AREA</span>
    <h1>Welcome back</h1><p class="muted">Sign in to review support activity.</p>
    {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="80" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary-button full-width" type="submit">Sign in <span>→</span></button>
    <p class="login-foot">Authorized administrators only</p>
  </form>
</section>
{% endblock %}
