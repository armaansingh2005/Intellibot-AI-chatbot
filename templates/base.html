<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#f5f7fb">
  <script>
    try {
      const savedTheme = localStorage.getItem("intellibot-theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = savedTheme || (systemPrefersDark ? "dark" : "light");
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <title>{% block title %}IntelliBot AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('chat.index') }}" aria-label="IntelliBot home">
      <span class="brand-mark">i</span><span>intellibot<span class="brand-ai">.ai</span></span>
    </a>
    <nav class="topnav" aria-label="Main navigation">
      <a href="{{ url_for('chat.index') }}">Assistant</a>
      <a href="{{ url_for('chat.history_page') }}">History</a>
      <a class="nav-admin" href="{{ url_for('admin.dashboard') }}">Admin</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark</span>
      </button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
